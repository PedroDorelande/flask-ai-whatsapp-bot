# =====================================================
# HTTP — Redirect para HTTPS + ACME challenge (certbot)
# =====================================================
server {
    listen 80;
    server_name movidachat.duckdns.org movidawaha.duckdns.org;

    # Certbot precisa desse path para validar o domínio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redireciona tudo para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =====================================================
# HTTPS — movidachat.duckdns.org → Flask App (painel do bot)
# =====================================================
server {
    listen 443 ssl;
    server_name movidachat.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/movidachat.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/movidachat.duckdns.org/privkey.pem;

    # Segurança SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Arquivos estáticos direto pelo Nginx (rápido)
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Tudo mais vai pro Flask
    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
    }
}

# =====================================================
# HTTPS — movidawaha.duckdns.org → WAHA Dashboard + API
# =====================================================
server {
    listen 443 ssl;
    server_name movidawaha.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/movidachat.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/movidachat.duckdns.org/privkey.pem;

    # Segurança SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy reverso para o WAHA (dashboard + API)
    location / {
        proxy_pass http://waha:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
    }
}

# =====================================================
# Fallback: acesso direto por IP (enquanto SSL não está ativo)
# =====================================================
server {
    listen 80 default_server;
    server_name _;

    # Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Arquivos estáticos
    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy reverso para WAHA via /waha/ (acesso por IP)
    location /waha/ {
        proxy_pass http://waha:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Tudo mais vai pro Flask
    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
    }
}
